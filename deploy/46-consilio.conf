# consilio.medicinainteligente.ai — motor de interacciones (contenedor consilio).
# Se copia a /opt/recetalia/deploy-recetalia/nginx/conf.d/ del `.98`.
#
# TLS: jonasal/nginx-certbot parsea el `server_name` y pide un cert de Let's
#      Encrypt por HTTP-01. Eso EXIGE que `consilio.medicinainteligente.ai`
#      resuelva a 138.197.150.98 y esté **DNS-only** (gris) en Cloudflare: si
#      va proxeado, CF intercepta el challenge del :80 y el cert nunca sale.
#      Es la misma razón por la que `www` no está en 45-medicinainteligente.conf.
#
# El redirect 80 -> 443 y el location del challenge los pone la propia imagen
# jonasal; por eso este archivo sólo declara el bloque 443.
#
# Resolver: NO se declara — 05-common.conf ya trae `resolver 127.0.0.11`.

server {
    listen 443 ssl;
    http2 on;
    server_name consilio.medicinainteligente.ai;

    ssl_certificate     /etc/letsencrypt/live/consilio.medicinainteligente.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/consilio.medicinainteligente.ai/privkey.pem;

    # Las consultas son listas de nombres de fármacos: unos pocos KB.
    client_max_body_size 256k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=86400" always;

    # ⚠️ La base de interacciones es CC BY-NC-SA: no se indexa mientras la
    # licencia no esté resuelta. El header vale para buscadores que respeten
    # X-Robots-Tag aunque nadie pida /robots.txt.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # proxy_pass por variable (resuelve en runtime): si el contenedor no está
    # levantado, nginx arranca igual en vez de fallar el `nginx -t`.
    location / {
        set $consilio consilio:8000;
        proxy_pass http://$consilio;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # El primer request después de arrancar abre la base y arma los índices.
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
