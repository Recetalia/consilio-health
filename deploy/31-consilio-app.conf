# Server 178.128.234.182 (borde compartido /opt/edge, red edge-net). Copia de 47-consilio-app.conf del .98
# con resolver propio: acá no hay 05-common.conf que lo declare.
# INSTALAR: cp a /opt/edge/conf.d/ + symlink en /etc/nginx/conf.d/ del edge-nginx (jonasal sólo los crea al arrancar).

# app.consilio.medicinainteligente.ai — la app Consilio completa (UI + API).
# Se copia a /opt/recetalia/deploy-recetalia/nginx/conf.d/ del `.98`, junto al
# 46-consilio.conf (que en consilio.medicinainteligente.ai sirve la landing).
#
# DNS: `*.consilio` es DNS-only (gris) en Cloudflare → 138.197.150.98. Sin el
# proxy de CF no hay caché de CF: los ?v= de la UI igual se mantienen porque el
# 46 sí va proxeado y sirve /ui/.
#
# TLS: Let's Encrypt por HTTP-01. ORDEN: primero el cert, después el vhost (un
# vhost cuyo cert no existe tumba el `nginx -t`):
#   docker exec recetalia-nginx sh -c 'certbot certonly --webroot \
#     -w /var/www/letsencrypt -d app.consilio.medicinainteligente.ai \
#     --email $CERTBOT_EMAIL --agree-tos --no-eff-email -n'
# La renovación la hace jonasal sola, como con el resto de los vhosts.
#
# INSTALAR (igual que el 46: jonasal sólo crea los symlinks al arrancar):
#   docker exec recetalia-nginx ln -s /etc/nginx/user_conf.d/47-consilio-app.conf /etc/nginx/conf.d/
#   docker exec recetalia-nginx nginx -t && docker exec recetalia-nginx nginx -s reload
#
# deploy-recetalia/scripts/deploy.sh lo excluye del rsync --delete
# (RSYNC_KEEP_EXCLUDES): no vive en ese repo.

server {
    listen 443 ssl;
    http2 on;
    server_name app.consilio.medicinainteligente.ai;
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate     /etc/letsencrypt/live/app.consilio.medicinainteligente.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.consilio.medicinainteligente.ai/privkey.pem;

    client_max_body_size 256k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=86400" always;
    # ⚠️ Base CC BY-NC-SA: la app no se indexa. Ver 46-consilio.conf.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        set $consilio consilio:8000;
        proxy_pass http://$consilio;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
