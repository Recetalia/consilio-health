# consilio.pre.medicinainteligente.ai — Consilio de PREPRODUCCIÓN en el `.98` (app + API).
# Decidido 2026-10-01 (spec doctorhub "preproducción unificada en el .98", P5): PRE y PROD
# separados. PROD = 178.128.234.182 (`30-`/`31-consilio*.conf`); PRE = este contenedor
# `consilio` del .98 (compose `deploy/docker-compose.98.yml`, key propia de PRE).
# recetalia PRE lo llama por red interna (`http://consilio:8000`), no por este dominio.
#
# DNS: comodín `*.pre.medicinainteligente.ai` → .98, DNS only (gris).
# TLS: Let's Encrypt HTTP-01 (una sola cuenta LE en el .98, no hace falta --account):
#   docker exec recetalia-nginx sh -c 'certbot certonly --webroot -w /var/www/letsencrypt \
#     -d consilio.pre.medicinainteligente.ai --email $CERTBOT_EMAIL --agree-tos --no-eff-email -n'
# INSTALAR (después del cert): copiar a /opt/recetalia/deploy-recetalia/nginx/conf.d/ +
#   docker exec recetalia-nginx ln -s /etc/nginx/user_conf.d/48-consilio-pre.conf /etc/nginx/conf.d/
#   docker exec recetalia-nginx nginx -t && docker exec recetalia-nginx nginx -s reload
# Resolver: NO se declara — 05-common.conf del .98 ya trae `resolver 127.0.0.11`.

server {
    listen 443 ssl;
    http2 on;
    server_name consilio.pre.medicinainteligente.ai;

    ssl_certificate     /etc/letsencrypt/live/consilio.pre.medicinainteligente.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/consilio.pre.medicinainteligente.ai/privkey.pem;

    client_max_body_size 256k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=86400" always;
    # ⚠️ Base CC BY-NC-SA: la app no se indexa. Ver 46-consilio.conf.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        set $consilio consilio:8000;
        proxy_pass http://$consilio;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
