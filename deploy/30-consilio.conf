# Server 178.128.234.182 (borde compartido /opt/edge, red edge-net). Copia de 46-consilio.conf del .98
# con resolver propio: acá no hay 05-common.conf que lo declare.
# INSTALAR: cp a /opt/edge/conf.d/ + symlink en /etc/nginx/conf.d/ del edge-nginx (jonasal sólo los crea al arrancar).

# consilio.medicinainteligente.ai — landing pública de Consilio en `/` y, por
# compatibilidad, las rutas de API del motor (clientes externos como PONS usan
# este dominio). La app completa (UI + API) vive en
# app.consilio.medicinainteligente.ai: ver 47-consilio-app.conf.
# Se copia a /opt/recetalia/deploy-recetalia/nginx/conf.d/ del `.98`.
#
# Lo que no es landing ni API redirige a `/`: la UI de consulta ya no se sirve
# en este dominio (su `/` es la landing), pero /ui/ sigue proxeado porque la
# landing usa de ahí el isotipo y el favicon.
#
# TLS: jonasal/nginx-certbot pide el cert de Let's Encrypt por HTTP-01.
#      Medido 2026-09-24: con el registro **proxeado** (naranja) en Cloudflare
#      el challenge del :80 SÍ llega al origen (se probó con un archivo en
#      /var/www/letsencrypt) y el cert salió. La advertencia anterior de que
#      hacía falta DNS-only era falsa. Cert emitido a mano la primera vez:
#        docker exec recetalia-nginx sh -c 'certbot certonly --webroot \
#          -w /var/www/letsencrypt -d consilio.medicinainteligente.ai \
#          --email $CERTBOT_EMAIL --agree-tos --no-eff-email -n'
#
# INSTALAR: copiar a /opt/recetalia/deploy-recetalia/nginx/conf.d/ NO alcanza.
#      jonasal no incluye user_conf.d: hace un symlink por archivo en
#      /etc/nginx/conf.d/ y SÓLO al arrancar. Sin el symlink, `nginx -t` pasa
#      (el archivo no se carga) y el dominio cae en el default_server, que es
#      la app de farmacias. Hace falta:
#        docker exec recetalia-nginx ln -s /etc/nginx/user_conf.d/46-consilio.conf /etc/nginx/conf.d/
#        docker exec recetalia-nginx nginx -t && docker exec recetalia-nginx nginx -s reload
#
# El redirect 80 -> 443 y el location del challenge los pone la propia imagen
# jonasal; por eso este archivo sólo declara el bloque 443.
#

server {
    listen 443 ssl;
    http2 on;
    server_name consilio.medicinainteligente.ai;
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate     /etc/letsencrypt/live/consilio.medicinainteligente.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/consilio.medicinainteligente.ai/privkey.pem;

    # Las consultas son listas de nombres de fármacos: unos pocos KB.
    client_max_body_size 256k;

    # proxy_pass por variable (resuelve en runtime): si el contenedor no está
    # levantado, nginx arranca igual en vez de fallar el `nginx -t`.
    set $consilio consilio:8000;

    # ⚠️ La base de interacciones es CC BY-NC-SA: la API y la UI no se indexan
    # mientras la licencia no esté resuelta. La landing sí (es marketing): sus
    # locations vacían la variable y nginx omite un add_header con valor vacío.
    # Va por variable porque un add_header dentro de un location anula TODOS
    # los add_header heredados del server (nosniff, HSTS...).
    set $consilio_robots "noindex, nofollow, noarchive";

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Robots-Tag $consilio_robots always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # El primer request después de arrancar abre la base y arma los índices.
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;

    # default_type y no add_header Content-Type: un add_header acá anularía los
    # heredados. Cloudflare cachea los .txt: tras cambiarlo, probar con ?v=.
    # Lista explícita y no `Allow: /$`: nginx lee `$` dentro del string como
    # variable y el `nginx -t` falla (medido 2026-09-26).
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /interactions\nDisallow: /contraindications\nDisallow: /drugs/\nDisallow: /conditions/\nDisallow: /data/\nDisallow: /health\nDisallow: /docs\nDisallow: /redoc\nDisallow: /openapi.json\nDisallow: /admin/\nDisallow: /ui/\nAllow: /\n";
    }

    # ---- landing (indexable) ----
    # Con variable en proxy_pass, la URI escrita reemplaza entera a la pedida.
    # Desde 2026-10-01 la landing vive en el sitio madre (medicinainteligente.ai/consilio/).
    # Acá sólo quedan la API (compatibilidad) y el logo de email; lo de la landing → 301.
    location = / {
        return 301 https://medicinainteligente.ai/consilio/$is_args$args;
    }
    # Recursos públicos para email y terceros (logo de campañas), mismo patrón que las otras
    # apps de MedicinaInteligente: https://<app>.medicinainteligente.ai/assets/<app>-logo-email.png
    location /assets/ {
        set $consilio_robots "";
        # rewrite + proxy_pass sin URI: con variable, un proxy_pass con path reemplaza
        # la URI entera en vez de anexar el resto.
        rewrite ^/assets/(.*)$ /landing/assets/$1 break;
        proxy_pass http://$consilio;
    }

    location /landing/ {
        rewrite ^/landing/(.*)$ https://medicinainteligente.ai/consilio/$1 permanent;
    }

    # ---- API del motor (noindex; la API key la exige la app) ----
    location = /interactions      { proxy_pass http://$consilio; }
    location = /contraindications { proxy_pass http://$consilio; }
    location /drugs/              { proxy_pass http://$consilio; }
    location /conditions/         { proxy_pass http://$consilio; }
    location /data/               { proxy_pass http://$consilio; }
    location /health              { proxy_pass http://$consilio; }
    location = /docs              { proxy_pass http://$consilio; }
    location = /redoc             { proxy_pass http://$consilio; }
    location = /openapi.json      { proxy_pass http://$consilio; }
    location /admin/              { proxy_pass http://$consilio; }
    # Estáticos de la UI: la landing usa el isotipo y el favicon de acá.
    location /ui/                 { proxy_pass http://$consilio; }

    # Cualquier otra cosa (incluidos enlaces viejos a la demo) va a la landing,
    # que tiene el botón a la app.
    # Lo que no es API (recursos sueltos de la landing servidos en la raíz) → sitio madre.
    location / {
        return 301 https://medicinainteligente.ai/consilio$request_uri;
    }
}
